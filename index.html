<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Vault</title>
<meta name="theme-color" content="#5B4FE9">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="shortcut icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vault">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#F7F4EF; --bg2:#F0EEFA;
    --surface:#FFFFFF;
    --ink:#2A2733; --muted:#8B8794; --hair:#EBE8F0;
    --accent:#5B4FE9; --accent-soft:#EEEBFC;
    --danger:#E15B5B; --danger-soft:#FCEDED;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(1200px 600px at 10% -10%, var(--bg2), transparent),
                radial-gradient(1000px 500px at 100% 0%, #FDF0EA, transparent),
                var(--bg1);
    font-family:'Inter',sans-serif; color:var(--ink);
  }
  svg.ic{width:1em;height:1em;vertical-align:-0.15em;}
  .wrap{max-width:880px; margin:0 auto; padding:32px 20px 80px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{
    width:38px; height:38px; border-radius:12px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px;
    box-shadow:0 6px 16px rgba(91,79,233,.35);
  }
  .brand h1{font-family:'Poppins',sans-serif; font-size:21px; margin:0; font-weight:700;}
  .brand p{margin:0; font-size:12px; color:var(--muted);}
  .add-btn{
    display:flex; align-items:center; gap:8px; background:var(--accent); color:#fff; border:none;
    padding:11px 18px; border-radius:14px; font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    cursor:pointer; box-shadow:0 8px 18px rgba(91,79,233,.28); transition:transform .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .add-btn:hover{transform:translateY(-2px); box-shadow:0 10px 22px rgba(91,79,233,.38);}
  .lock-btn{
    display:flex; align-items:center; justify-content:center; width:42px; height:42px;
    background:var(--surface); border:1px solid var(--hair); border-radius:14px; color:var(--muted);
    cursor:pointer; font-size:16px; transition:border-color .15s, color .15s;
  }
  .lock-btn:hover{border-color:var(--accent); color:var(--accent);}

  .lang-switch{display:flex; gap:3px; background:var(--surface); border:1px solid var(--hair); border-radius:12px; padding:3px;}
  .lang-switch button{
    border:none; background:none; padding:6px 10px; border-radius:9px; font-family:'Inter'; font-size:11.5px;
    font-weight:600; color:var(--muted); cursor:pointer; letter-spacing:.02em;
  }
  .lang-switch button.active{background:var(--accent); color:#fff;}

  html[dir="rtl"] body{font-family:'Cairo','Inter',sans-serif;}
  html[dir="rtl"] .f-display, html[dir="rtl"] h1, html[dir="rtl"] h2{font-family:'Cairo','Poppins',sans-serif;}
  html[dir="rtl"] .search svg, html[dir="rtl"] .picker-search svg{left:auto; right:22px;}
  html[dir="rtl"] .search input{padding:19px 56px 19px 22px;}
  html[dir="rtl"] .picker-search input{padding:16px 50px 16px 20px;}
  html[dir="rtl"] .val, html[dir="rtl"] .lock-card input, html[dir="rtl"] .form input{direction:ltr; text-align:right;}

  /* lock / create-password screen */
  .lock-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background: radial-gradient(1200px 600px at 10% -10%, var(--bg2), transparent),
                radial-gradient(1000px 500px at 100% 0%, #FDF0EA, transparent), var(--bg1);
  }
  .lock-card{width:100%; max-width:360px; text-align:center;}
  .lock-badge{
    width:64px; height:64px; border-radius:50%; border:2px solid var(--accent); margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:26px;
    box-shadow:0 0 0 8px var(--accent-soft);
  }
  .lock-card h1{font-family:'Poppins',sans-serif; font-size:24px; margin:0 0 4px;}
  .lock-card p.sub{color:var(--muted); font-size:13px; margin:0 0 22px;}
  .lock-card input{
    width:100%; padding:14px 16px; border-radius:14px; border:1.5px solid var(--hair); background:var(--surface);
    font-family:'JetBrains Mono'; font-size:14px; color:var(--ink); margin-bottom:10px; box-sizing:border-box;
  }
  .lock-card input:focus{outline:none; border-color:var(--accent);}
  .lock-card .lock-error{display:flex; align-items:center; gap:6px; justify-content:center; color:#B84B4B; font-size:12.5px; margin-bottom:10px;}
  .lock-submit{
    width:100%; padding:14px; border-radius:14px; border:none; background:var(--accent); color:#fff;
    font-family:'Inter'; font-weight:600; font-size:14.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .lock-submit:hover{filter:brightness(1.08);}
  .lock-submit:disabled{opacity:.5; cursor:default;}
  .lock-hint{font-size:11px; color:var(--muted); margin-top:16px;}
  .recovery-key-box{
    font-family:'JetBrains Mono'; font-size:16px; font-weight:600; letter-spacing:.03em;
    background:var(--accent-soft); color:var(--accent); border:1.5px dashed var(--accent);
    border-radius:14px; padding:16px; margin-bottom:12px; word-break:break-all; user-select:all;
  }
  .recovery-confirm{
    display:flex; align-items:flex-start; gap:8px; text-align:left; font-size:12.5px; color:var(--ink);
    margin:4px 0 16px; cursor:pointer;
  }
  html[dir="rtl"] .recovery-confirm{text-align:right;}
  .recovery-confirm input{width:auto; margin:2px 0 0;}

  .sync-note{
    display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);
    background:#F2F0FA; border:1px solid #E4E0F5; border-radius:10px; padding:8px 12px; margin-bottom:18px;
  }
  .sync-note.warn{background:#FBF3E6; border-color:#F0DBB0; color:#93650F;}
  .sync-note svg{flex-shrink:0;}

  .search{position:relative; margin-bottom:28px;}
  .search svg{position:absolute; left:22px; top:50%; transform:translateY(-50%); color:var(--accent); font-size:21px;}
  .search input{
    width:100%; padding:19px 22px 19px 56px; border-radius:20px; border:1.5px solid var(--hair);
    background:var(--surface); font-family:'Inter'; font-size:16.5px; font-weight:500; color:var(--ink);
    box-shadow:0 10px 26px rgba(91,79,233,.08), 0 2px 8px rgba(42,39,51,.04);
    transition:box-shadow .18s ease, border-color .18s ease;
  }
  .search input::placeholder{color:#B4AFC2; font-weight:400;}
  .search input:focus{outline:none; border-color:var(--accent); box-shadow:0 12px 30px rgba(91,79,233,.14), 0 2px 8px rgba(42,39,51,.04);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:16px;}
  .card{
    background:var(--surface); border:1px solid var(--hair); border-radius:var(--radius);
    padding:18px 12px 16px; display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    text-align:center;
  }
  .card:hover{transform:translateY(-4px); box-shadow:0 14px 28px rgba(42,39,51,.08); border-color:transparent;}
  .card .name{font-size:13px; font-weight:600; font-family:'Inter'; line-height:1.2;}
  .card .count{font-size:11px; color:var(--muted); font-family:'JetBrains Mono';}

  .icon{
    border-radius:16px; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden; flex-shrink:0;
  }
  .icon .fallback{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Poppins',sans-serif; font-weight:700; letter-spacing:.02em;
  }
  .icon img{
    position:relative; z-index:1; width:62%; height:62%; object-fit:contain;
    background:#fff; border-radius:28%; padding:8%; box-sizing:border-box; display:block;
  }
  .icon img.uploaded{
    width:100%; height:100%; object-fit:cover; background:none; padding:0; border-radius:inherit;
  }
  .card .icon{width:52px; height:52px;}
  .card .icon .fallback{font-size:16px;}
  .app-opt .icon{width:36px; height:36px;}
  .app-opt .icon .fallback{font-size:12px;}
  .panel-head .icon{width:44px; height:44px;}
  .panel-head .icon .fallback{font-size:15px;}
  .preview-icon .icon{width:44px; height:44px; margin:0 auto;}
  .preview-icon .icon .fallback{font-size:15px;}

  .empty{text-align:center; padding:70px 20px; color:var(--muted);}
  .empty svg{font-size:30px; margin-bottom:10px; color:#C9C6D4;}
  .empty p{margin:4px 0; font-size:13px;}

  .overlay{
    position:fixed; inset:0; background:rgba(30,27,41,.45); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;
    animation:fadeIn .18s ease;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .panel{
    background:var(--surface); border-radius:24px; width:100%; max-width:440px; max-height:88vh;
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 30px 60px rgba(30,27,41,.25);
    animation:pop .22s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes pop{from{opacity:0; transform:scale(.94) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);}}
  .panel-head{padding:22px 22px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--hair);}
  .panel-head h2{font-family:'Poppins'; font-size:17px; margin:0; font-weight:600;}
  .panel-head p{margin:0; font-size:12px; color:var(--muted);}
  .panel-head .close{margin-left:auto; background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:6px;}
  .panel-body{padding:18px 22px; overflow-y:auto; display:flex; flex-direction:column; gap:14px;}

  .acct-card{background:#FBFAFC; border:1px solid var(--hair); border-radius:16px; padding:14px 16px;}
  .acct-card .acct-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; gap:8px;}
  .acct-card .acct-label{font-size:12px; font-weight:600; color:var(--accent); font-family:'Inter'; flex:1; display:flex; align-items:center; gap:5px;}
  .acct-actions{display:flex; gap:4px;}
  .icon-btn{background:none; border:none; color:var(--muted); padding:6px; border-radius:8px; cursor:pointer; display:flex;}
  .icon-btn:hover{background:var(--accent-soft); color:var(--accent);}
  .icon-btn.danger:hover{background:var(--danger-soft); color:var(--danger);}
  .field{display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--hair);}
  .field:last-child{border-bottom:none;}
  .field .lbl{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:2px;}
  .field .val{font-family:'JetBrains Mono'; font-size:13px; word-break:break-all;}
  .field-main{min-width:0; flex:1;}

  .add-acct-btn{
    border:1.5px dashed #D7D3E3; background:none; border-radius:14px; padding:12px; color:var(--accent);
    font-family:'Inter'; font-weight:600; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .add-acct-btn:hover{background:var(--accent-soft); border-color:var(--accent);}

  .form input{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--hair); font-size:13px;
    font-family:'JetBrains Mono'; background:#fff; margin-bottom:8px; color:var(--ink);
  }
  .form input::placeholder{font-family:'Inter'; color:#B4AFC2;}
  .form input:focus{outline:none; border-color:var(--accent);}
  .form-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:4px;}
  .btn-ghost{background:none; border:none; color:var(--muted); padding:8px 12px; border-radius:10px; font-size:13px; cursor:pointer;}
  .btn-ghost:hover{background:#F2F0F7;}
  .btn-solid{background:var(--accent); color:#fff; border:none; padding:8px 16px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer;}
  .btn-solid:hover{filter:brightness(1.08);}
  .btn-solid.danger-solid{background:var(--danger);}
  .confirm-bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--danger-soft); border:1px solid #F3C6C6; border-radius:12px;
    padding:10px 12px; margin-top:4px; font-size:12.5px; color:#8A3B3B;
  }
  .confirm-bar svg{flex-shrink:0; margin-right:4px;}
  .panel-foot{padding:14px 22px 20px; border-top:1px solid var(--hair);}
  .delete-app-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    background:none; border:none; color:var(--danger); font-family:'Inter'; font-weight:600;
    font-size:13px; padding:10px; border-radius:12px; cursor:pointer;
  }
  .delete-app-btn:hover{background:var(--danger-soft);}
  .btn-solid:disabled{opacity:.4; cursor:default;}

  .picker-search{position:relative; margin-bottom:14px;}
  .picker-search svg{position:absolute; left:20px; top:50%; transform:translateY(-50%); color:var(--accent); font-size:18px;}
  .picker-search input{
    padding:16px 20px 16px 50px; margin-bottom:0; border-radius:18px; border:1.5px solid var(--hair);
    font-size:15px; font-weight:500; box-shadow:0 8px 20px rgba(91,79,233,.07);
  }

  .cat-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:14px 0 8px; padding-top:2px;}
  .cat-label:first-child{margin-top:0;}

  .app-picker{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .app-opt{display:flex; flex-direction:column; align-items:center; gap:6px; background:#FBFAFC; border:1px solid var(--hair); border-radius:14px; padding:10px 4px; cursor:pointer; transition:border-color .15s;}
  .app-opt:hover{border-color:var(--accent);}
  .app-opt span.label{font-size:10px; color:var(--ink); text-align:center; line-height:1.15;}
  .divider{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:11px; margin:16px 0 10px;}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--hair);}
  .upload-link{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--accent);
    cursor:pointer; padding:6px 10px; border-radius:10px;
  }
  .upload-link:hover{background:var(--accent-soft);}
  .icon-edit-wrap{position:relative; cursor:pointer; flex-shrink:0; z-index:0;}
  .icon-edit-wrap .icon{position:relative; z-index:1;}
  .icon-edit-badge{
    position:absolute; bottom:-3px; right:-3px; width:18px; height:18px; border-radius:50%;
    background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:9px; border:2px solid var(--surface); z-index:2;
  }
  .custom-form{text-align:center;}
  .custom-form .hint{font-size:10.5px; color:var(--muted); margin:-4px 0 10px;}
  .color-row{display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:2px;}
  .color-picker{display:flex; gap:7px; flex-wrap:wrap; margin:2px 0 12px; max-width:250px;}
  .color-wheel-wrap{
    position:relative; width:26px; height:26px; flex-shrink:0; border-radius:50%; cursor:pointer;
    background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.2);
    margin-bottom:12px;
  }
  .color-wheel-wrap input[type="color"]{
    position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:none; padding:0;
  }
  .color-wheel-wrap .wheel-icon{
    pointer-events:none; color:#fff; font-size:11px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));
  }
  .swatch{width:17px; height:17px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; box-shadow:0 1px 2px rgba(0,0,0,.15); flex-shrink:0;}
  .swatch.selected{border-color:var(--ink); transform:scale(1.35);}
</style>
</head>
<body>
<div id="lockScreen"></div>
<div id="mainApp" style="display:none;">
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">SVG_SHIELD</div>
      <div>
        <h1>My Vault</h1>
        <p id="appSubtitle">Every app, every website, every account, one place</p>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
      <button class="lock-btn" id="lockBtnEl" onclick="lockVault()" title="Lock vault">SVG_LOCK</button>
      <button class="add-btn" onclick="openAddApp()">SVG_PLUS <span id="addAppBtnText">Add app</span></button>
    </div>
  </header>

  <div id="syncNote"></div>

  <div class="search">
    SVG_SEARCH
    <input id="searchInput" placeholder="Search your apps or websites..." oninput="render()">
  </div>

  <div id="grid" class="grid"></div>
</div>
</div>

<div id="modalRoot"></div>
<input type="file" id="globalIconFile" accept="image/*" style="display:none" onchange="handleAppIconUpload(event)">

<script>
// ---------- self-contained icon set for UI chrome (no external files) ----------
const SVG = {
  shield:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.6 8 11 4.6-2.4 8-6 8-11V5z"/></svg>',
  plus:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  close:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  pencil:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>',

// ---- encryption helpers (Web Crypto: PBKDF2 -> AES-GCM, key-wrapping so both a password
//      and a recovery key can each independently unlock the same vault key) ----
function bufToB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64ToBuf(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
async function deriveKey(secret, salt){
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey("raw", enc.encode(secret), {name:"PBKDF2"}, false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"},
    material, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]
  );
}
async function generateDataKey(){
  return crypto.subtle.generateKey({name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
}
async function wrapWithSecret(secret, keyToWrap){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const wrappingKey = await deriveKey(secret, salt);
  const raw = await crypto.subtle.exportKey("raw", keyToWrap);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({name:"AES-GCM", iv}, wrappingKey, raw);
  return {salt:bufToB64(salt), iv:bufToB64(iv), data:bufToB64(cipher)};
}
async function unwrapWithSecret(secret, wrapBlob){
  const wrappingKey = await deriveKey(secret, b64ToBuf(wrapBlob.salt));
  const raw = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToBuf(wrapBlob.iv)}, wrappingKey, b64ToBuf(wrapBlob.data));
  return crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, true, ["encrypt","decrypt"]);
}
async function encryptVaultWithKey(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const cipher = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(obj)));
  return {iv:bufToB64(iv), data:bufToB64(cipher)};
}
async function decryptVaultWithKey(key, ivB64, dataB64){
  const dec = new TextDecoder();
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToBuf(ivB64)}, key, b64ToBuf(dataB64));
  return JSON.parse(dec.decode(plain));
}
function genRecoveryKey(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no ambiguous 0/O/1/I
  const bytes = crypto.getRandomValues(new Uint8Array(20));
  let s = "";
  for(let i=0;i<20;i++) s += chars[bytes[i] % chars.length];
  return s.match(/.{1,5}/g).join("-");
}

  const map = {
    'auth/email-already-in-use': lang==='ar' ? 'يوجد حساب بهذا البريد الإلكتروني بالفعل \u2014 حاول تسجيل الدخول.' : lang==='fr' ? 'Un compte avec cet e-mail existe déjà \u2014 essayez de vous connecter.' : 'An account with that email already exists — try logging in instead.',
    'auth/invalid-email': t('invalidEmail'),
    'auth/weak-password': t('weakPassword'),
    'auth/wrong-password': lang==='ar' ? 'البريد الإلكتروني أو كلمة المرور غير صحيحة.' : lang==='fr' ? 'E-mail ou mot de passe incorrect.' : 'Incorrect email or password.',
    'auth/user-not-found': lang==='ar' ? 'البريد الإلكتروني أو كلمة المرور غير صحيحة.' : lang==='fr' ? 'E-mail ou mot de passe incorrect.' : 'Incorrect email or password.',
    'auth/invalid-credential': lang==='ar' ? 'البريد الإلكتروني أو كلمة المرور غير صحيحة.' : lang==='fr' ? 'E-mail ou mot de passe incorrect.' : 'Incorrect email or password.',
    'auth/too-many-requests': lang==='ar' ? 'محاولات كثيرة جدًا \u2014 انتظر لحظة ثم أعد المحاولة.' : lang==='fr' ? 'Trop de tentatives \u2014 patientez un instant.' : 'Too many attempts — wait a moment and try again.',
    'auth/network-request-failed': lang==='ar' ? 'خطأ في الشبكة \u2014 تحقق من الاتصال.' : lang==='fr' ? 'Erreur réseau \u2014 vérifiez votre connexion.' : 'Network error — check your connection.',
    'auth/unauthorized-domain': lang==='ar' ? 'هذا الموقع غير مصرح له في مشروع Firebase بعد.' : lang==='fr' ? 'Ce site n\u2019est pas encore autorisé dans votre projet Firebase.' : 'This website isn\u2019t authorized in your Firebase project yet.',
  };
  return map[code] || (e && e.message) || (lang==='ar' ? 'حدث خطأ ما. حاول مرة أخرى.' : lang==='fr' ? 'Une erreur est survenue. Réessayez.' : 'Something went wrong. Try again.');

function showConfirmDialog(message, onConfirm){
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML = `
    <div class="panel" style="max-width:340px;">
      <div class="panel-body" style="padding-top:24px;">
        <p style="font-size:14px; color:var(--ink); line-height:1.6; margin:0 0 18px;">${esc(message)}</p>
        <div class="form-actions" style="justify-content:center;">
          <button class="btn-ghost" id="confirmDialogCancel">${esc(t('cancel'))}</button>
          <button class="btn-solid" id="confirmDialogOk">${esc(t('continueBtn'))}</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  const remove = () => wrap.remove();
  wrap.querySelector('#confirmDialogCancel').onclick = remove;
  wrap.querySelector('#confirmDialogOk').onclick = () => { remove(); onConfirm(); };
  wrap.addEventListener('click', e => { if(e.target === wrap) remove(); });
}

async function startPasswordReset(){
  const email = document.getElementById('lockEmail').value.trim();
  if(!email || !email.includes('@')){ showLockError(t('enterEmailFirst')); return; }
  showConfirmDialog(t('forgotHint'), async () => {
    try{
      await window.fb.sendPasswordResetEmail(window.fb.auth, email);
      showLockNotice(t('resetSent'));
    }catch(e){
      showLockError(friendlyFirebaseError(e));
    }
  });
}

async function submitCreateAccount(){
  const email = document.getElementById('lockEmail').value.trim();
  const pw = document.getElementById('lockPw').value;
  const pw2 = document.getElementById('lockPw2').value;
  if(!email || !email.includes('@')){ showLockError(t('invalidEmail')); return; }
  if(pw.length < 6){ showLockError(t('weakPassword')); return; }
  if(pw !== pw2){ showLockError(t('passwordMismatch')); return; }
  const btn = document.getElementById('lockSubmitBtn');
  btn.disabled = true;
  try{
    const cred = await window.fb.createUserWithEmailAndPassword(window.fb.auth, email, pw);
    currentUid = cred.user.uid;
    const key = await generateDataKey();
    const pwWrap = await wrapWithSecret(pw, key);
    const recoveryKey = genRecoveryKey();
    const rkWrap = await wrapWithSecret(recoveryKey, key);
    dataKey = key;
    apps = [];
    const vaultBlob = await encryptVaultWithKey(dataKey, apps);
    await window.fb.setDoc(window.fb.doc(window.fb.db, 'vaults', currentUid), {
      pwWrap, rkWrap, vaultIv: vaultBlob.iv, vaultData: vaultBlob.data
    });
    storageOk = true;
    renderRecoveryReveal(recoveryKey);
  }catch(e){
    showLockError(friendlyFirebaseError(e));
    btn.disabled = false;
  }
}

async function submitLogin(){
  const email = document.getElementById('lockEmail').value.trim();
  const pw = document.getElementById('lockPw').value;
  const btn = document.getElementById('lockSubmitBtn');
  btn.disabled = true;
  try{
    const cred = await window.fb.signInWithEmailAndPassword(window.fb.auth, email, pw);
    currentUid = cred.user.uid;
    const snap = await window.fb.getDoc(window.fb.doc(window.fb.db, 'vaults', currentUid));
    if(snap.exists()){
      const doc = snap.data();
      try{
        dataKey = await unwrapWithSecret(pw, doc.pwWrap);
        apps = await decryptVaultWithKey(dataKey, doc.vaultIv, doc.vaultData);
        enterApp();
      }catch(unwrapErr){
        // password works for Firebase login but not for unlocking the vault key —
        // this means the password was changed via email reset since the vault was last saved
        renderRecoveryUnlock(pw);
      }
    } else {
      const key = await generateDataKey();
      const pwWrap = await wrapWithSecret(pw, key);
      const recoveryKey = genRecoveryKey();
      const rkWrap = await wrapWithSecret(recoveryKey, key);
      dataKey = key;
      apps = [];
      const vaultBlob = await encryptVaultWithKey(dataKey, apps);
      await window.fb.setDoc(window.fb.doc(window.fb.db, 'vaults', currentUid), {
        pwWrap, rkWrap, vaultIv: vaultBlob.iv, vaultData: vaultBlob.data
      });
      storageOk = true;
      renderRecoveryReveal(recoveryKey);
    }
  }catch(e){
    showLockError(friendlyFirebaseError(e));
    btn.disabled = false;
  }
}

function renderRecoveryReveal(recoveryKey){
  const el = document.getElementById('lockScreen');
  el.style.display = 'flex';
  el.className = 'lock-wrap';
  el.innerHTML = `
    <div class="lock-card">
      <div class="lock-badge">${SVG.key}</div>
      <h1>${esc(t('recoveryTitle'))}</h1>
      <p class="sub">${esc(t('recoverySub'))}</p>
      <div class="recovery-key-box" id="recoveryKeyBox">${esc(recoveryKey)}</div>
      <button type="button" class="upload-link" style="margin-bottom:14px;" onclick="copyRecoveryKey('${recoveryKey}', this)">${SVG.copy} ${esc(t('copyKey'))}</button>
      <label class="recovery-confirm">
        <input type="checkbox" id="recoverySavedCheck" onchange="document.getElementById('recoveryContinueBtn').disabled = !this.checked">
        ${esc(t('savedItConfirm'))}
      </label>
      <button class="lock-submit" id="recoveryContinueBtn" disabled onclick="enterApp()">${esc(t('continueBtn'))}</button>
    </div>
  `;
}
function copyRecoveryKey(key, btn){
  navigator.clipboard && navigator.clipboard.writeText(key).catch(()=>{});
  const original = btn.innerHTML;
  btn.innerHTML = `${SVG.check} ${esc(t('copied'))}`;
  setTimeout(()=>{ btn.innerHTML = original; }, 1500);
}

function renderRecoveryUnlock(newPassword){
  pendingRewrapPassword = newPassword;
  const el = document.getElementById('lockScreen');
  el.style.display = 'flex';
  el.className = 'lock-wrap';
  el.innerHTML = `
    <div class="lock-card">
      <div class="lock-badge">${SVG.key}</div>
      <h1>${esc(t('recoveryUnlockTitle'))}</h1>
      <p class="sub">${esc(t('recoveryUnlockSub'))}</p>
      <div id="lockError"></div>
      <input type="text" id="recoveryInput" placeholder="${esc(t('recoveryKeyPh'))}" style="text-transform:uppercase; font-family:'JetBrains Mono';" autofocus>
      <button class="lock-submit" id="recoverySubmitBtn" onclick="submitRecoveryUnlock()">${SVG.lock} ${esc(t('unlockBtn'))}</button>
      <div class="lock-hint"><a href="#" onclick="confirmStartFresh();return false;">${esc(t('noRecoveryKeyLink'))}</a></div>
    </div>
  `;
}

async function submitRecoveryUnlock(){
  const rk = document.getElementById('recoveryInput').value.trim().toUpperCase();
  const btn = document.getElementById('recoverySubmitBtn');
  btn.disabled = true;
  try{
    const snap = await window.fb.getDoc(window.fb.doc(window.fb.db, 'vaults', currentUid));
    const doc = snap.data();
    const key = await unwrapWithSecret(rk, doc.rkWrap);
    apps = await decryptVaultWithKey(key, doc.vaultIv, doc.vaultData);
    dataKey = key;
    // re-wrap the vault key under the new password so future logins work normally
    const newPwWrap = await wrapWithSecret(pendingRewrapPassword, dataKey);
    await window.fb.setDoc(window.fb.doc(window.fb.db, 'vaults', currentUid), {
      ...doc, pwWrap: newPwWrap
    });
    pendingRewrapPassword = null;
    storageOk = true;
    enterApp();
  }catch(e){
    showLockError(t('wrongRecoveryKey'));
    btn.disabled = false;
  }
}

function confirmStartFresh(){
  showConfirmDialog(t('startFreshConfirm'), async () => {
    const key = await generateDataKey();
    const pwWrap = await wrapWithSecret(pendingRewrapPassword, key);
    const recoveryKey = genRecoveryKey();
    const rkWrap = await wrapWithSecret(recoveryKey, key);
    dataKey = key;
    apps = [];
    const vaultBlob = await encryptVaultWithKey(dataKey, apps);
    await window.fb.setDoc(window.fb.doc(window.fb.db, 'vaults', currentUid), {
      pwWrap, rkWrap, vaultIv: vaultBlob.iv, vaultData: vaultBlob.data
    });
    storageOk = true;
    pendingRewrapPassword = null;
    renderRecoveryReveal(recoveryKey);
  });
}

async function saveApps(){
  try{
    if(!window.fb || !currentUid || !dataKey) throw new Error('not ready');
    const snap = await window.fb.getDoc(window.fb.doc(window.fb.db, 'vaults', currentUid));
    const existing = snap.exists() ? snap.data() : {};
    const vaultBlob = await encryptVaultWithKey(dataKey, apps);
    await window.fb.setDoc(window.fb.doc(window.fb.db, 'vaults', currentUid), {
      ...existing, vaultIv: vaultBlob.iv, vaultData: vaultBlob.data
    });
    storageOk = true;
  }catch(e){
    storageOk = false;
  }
  renderSyncNote();
}

function renderSyncNote(){
  const el = document.getElementById('syncNote');
  el.innerHTML = storageOk
    ? `<div class="sync-note">${SVG.check} ${esc(t('savedNote'))}</div>`
    : `<div class="sync-note warn">${SVG.warn} ${esc(t('notSavedNote'))}</div>`;
}

// Layered icon: colored tile behind, white "sticker" holding the real favicon on top,
// with the colored monogram as an automatic fallback if the favicon image fails to load.
function iconTile(app){
  if(app.icon){
    return `
      <div class="icon" style="background:${app.color||'#E4E1EE'};">
        <img class="uploaded" src="${app.icon}" alt="">
      </div>
    `;
  }
  const domain = app.domain || (app.name.toLowerCase().replace(/[^a-z0-9]/g,'') + '.com');
  const fg = contrastColor(app.color);
  const border = luminance(app.color) > 0.85 ? '1px solid rgba(0,0,0,.08)' : 'none';
  return `
    <div class="icon" style="background:${app.color}; border:${border};">
      <span class="fallback" style="color:${fg}">${esc(app.abbr)}</span>
      <img src="https://www.google.com/s2/favicons?sz=128&domain=${encodeURIComponent(domain)}" alt=""
           onerror="this.style.display='none'"
           onload="if(this.naturalWidth<=16){this.style.display='none'}else{this.previousElementSibling.style.display='none'}">
    </div>
  `;
}

function render(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  const grid = document.getElementById('grid');
  const filtered = apps.filter(a => a.name.toLowerCase().includes(q));
  if(apps.length === 0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${SVG.key}<p style="font-weight:600;color:var(--ink)">${esc(t('emptyTitle'))}</p><p>${esc(t('emptyHint'))}</p></div>`;
    return;
  }
  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${esc(t('noMatches',{q}))}</div>`;
    return;
  }
  grid.innerHTML = filtered.map(a => `
    <div class="card" onclick="openApp('${a.id}')">
      ${iconTile(a)}
      <div class="name">${esc(a.name)}</div>
      <div class="count">${esc(tCount(a.accounts.length,'accountsOne','accountsMany'))}</div>
    </div>
  `).join('');
}

            </div>
            <input id="customName" placeholder="${esc(t('appNamePh'))}" oninput="updateCustomPreview()">
            <input id="customDomain" placeholder="${esc(t('websitePh'))}" oninput="updateCustomPreview()">
            <div class="hint">${esc(t('domainHint'))}</div>
            <div class="hint">${esc(t('colorHint'))}</div>
            <div class="color-row">
              <label class="color-wheel-wrap" title="Pick any color">
                <input type="color" id="colorWheel" value="#5B4FE9" oninput="pickCustomColor(this.value)">
                <span class="wheel-icon">${SVG.pipette}</span>
              </label>
              <div id="colorPicker" class="color-picker"></div>
            </div>
            <div class="form-actions" style="justify-content:center;">
              <button class="btn-ghost" onclick="closeModal()">${esc(t('cancel'))}</button>
              <button class="btn-solid" id="customAddBtn" disabled onclick="createCustomApp()">${esc(t('addAppBtn'))}</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
  customColor = null;
  customUploadedIcon = null;
  renderAppPicker('');
  renderColorPicker();
  updateCustomPreview();
}

function renderAppPicker(filterText){
  const q = (filterText||'').toLowerCase().trim();
  const list = document.getElementById('pickerList');
  const items = FLAT_CATALOG.filter(c => c.name.toLowerCase().includes(q));
  if(items.length === 0){
    list.innerHTML = `<div style="text-align:center;color:var(--muted);font-size:12px;padding:16px 0;">${esc(t('noPickerMatches'))}</div>`;
    return;
  }
  list.innerHTML = `<div class="app-picker">` + items.map(c => `
    <div class="app-opt" onclick='createApp(${JSON.stringify(c.name)}, ${JSON.stringify(c.abbr)}, ${JSON.stringify(c.color)}, ${JSON.stringify(c.domain)}, ${JSON.stringify(c.cat || "Other")})'>
      ${iconTile(c)}
      <span class="label">${esc(c.name)}</span>
    </div>
  `).join('') + `</div>`;
}

function guessDomain(name){
  return name.toLowerCase().replace(/[^a-z0-9]/g,'') + '.com';
}

const CUSTOM_PALETTE = [
  // warm earth & terracotta
  "#C97B5D","#CB6843","#B7410E","#9C4A3A","#A0522D","#C2703D","#D98246","#E8A87C",
  // spice & gold
  "#C99A2E","#D4A017","#B8860B","#CC7722","#BF8130",
  // sage & olive greens
  "#87A96B","#708238","#4A5D23","#5F7A61","#3F6B4F","#2E5339","#1B8A6B","#14BF96",
  // teal & blue
  "#1F6F6F","#2C7A7B","#4A6FA5","#3B6E91","#6A7B8C","#5C7A99","#1B3A4B","#3693F3",
  // plum, wine & rose
  "#8E4585","#722F37","#6D2932","#9B4F6F","#C08497","#D6336C","#E1306C",
  // muted purples & indigos
  "#5B4FE9","#7360F2","#A89BC8","#6D4AFF",
  // soft pastels — beige, peach, baby pink, snow
  "#F5E6D3","#EAD9C4","#F2D2B6","#F7C9A6","#F9C6C9","#F6D5D9","#FADCE0","#FFF5EE",
  "#FDF6EC","#F4EFE6","#E9E4DA","#FFFFFF",
  // neutrals
  "#8C7B75","#A9967B","#5C5E68","#3A3B3C","#111111",
];

function luminance(hex){
  const c = hex.replace('#','');
  const r = parseInt(c.substring(0,2),16)/255, g = parseInt(c.substring(2,4),16)/255, b = parseInt(c.substring(4,6),16)/255;
  const lin = v => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
}
function contrastColor(hex){
  try{ return luminance(hex) > 0.55 ? "#2A2733" : "#ffffff"; }catch(e){ return "#ffffff"; }
}
let customColor = null;
let customUploadedIcon = null;

function renderColorPicker(){
  const el = document.getElementById('colorPicker');
  if(!el) return;
  el.innerHTML = CUSTOM_PALETTE.map(c => {
    const light = luminance(c) > 0.85;
    return `<button type="button" class="swatch ${customColor===c?'selected':''}" style="background:${c};${light?'box-shadow:0 0 0 1px rgba(0,0,0,.12) inset, 0 1px 2px rgba(0,0,0,.1);':''}" onclick="pickCustomColor('${c}')" aria-label="${c}"></button>`;
  }).join('');
}

function pickCustomColor(c){
  customColor = c;
  renderColorPicker();
  updateCustomPreview();
}

function autoColor(name){
  const palette = CUSTOM_PALETTE;
  return palette[name.length % palette.length] || palette[0];
}

function updateCustomPreview(){
  const name = document.getElementById('customName').value.trim();
  const domainField = document.getElementById('customDomain');
  if(!domainField.dataset.touched){
    domainField.placeholder = name ? `Website (optional, e.g. ${guessDomain(name)})` : "Website (optional, e.g. instagram.com)";
  }
  const domain = domainField.value.trim() || (name ? guessDomain(name) : '');
  const preview = document.getElementById('customPreview');
  const color = customColor || (name ? autoColor(name) : "#E4E1EE");
  const abbr = (name.slice(0,2) || "?").toUpperCase();
  preview.innerHTML = name || customUploadedIcon
    ? iconTile({name, abbr, color, domain, icon: customUploadedIcon})
    : `<div class="icon" style="background:#E4E1EE;margin:0 auto;"><span class="fallback" style="color:#B4AFC2;">?</span></div>`;
  document.getElementById('customAddBtn').disabled = !name;
  const removeBtn = document.getElementById('removeUploadBtn');
  if(removeBtn) removeBtn.style.display = customUploadedIcon ? 'inline-flex' : 'none';
}
document.addEventListener('input', (e) => { if(e.target && e.target.id === 'customDomain') e.target.dataset.touched = '1'; });

// ---------- uploading a photo from the phone as an icon ----------
function fileToIconDataUrl(file, cb){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const size = Math.min(img.width, img.height);
      const sx = (img.width - size)/2, sy = (img.height - size)/2;
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, size, size, 0, 0, 256, 256);
      cb(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function handleCustomIconUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  fileToIconDataUrl(file, (dataUrl) => {
    customUploadedIcon = dataUrl;
    updateCustomPreview();
  });
  e.target.value = '';
}

function clearCustomIconUpload(){
  customUploadedIcon = null;
  updateCustomPreview();
}

function triggerAppIconUpload(appId){
  window.editingIconAppId = appId;
  document.getElementById('globalIconFile').click();
}

function handleAppIconUpload(e){
  const file = e.target.files[0];
  if(!file || !window.editingIconAppId) return;
  fileToIconDataUrl(file, (dataUrl) => {
    const app = apps.find(a => a.id === window.editingIconAppId);
    if(app){
      app.icon = dataUrl;
      saveApps();
      render();
      renderAppPanel();
    }
  });
  e.target.value = '';
}

function createApp(name, abbr, color, domain, category, icon){
  const app = {id:uid(), name, abbr, color, domain, category: category || "Other", icon: icon || null, accounts:[]};
  apps.push(app);
  saveApps();
  render();
  openApp(app.id);
}

function createCustomApp(){
  const name = document.getElementById('customName').value.trim();
  if(!name) return;
  const domain = document.getElementById('customDomain').value.trim() || guessDomain(name);
  const color = customColor || autoColor(name);
  const abbr = name.trim().slice(0,2).toUpperCase();
  createApp(name, abbr, color, domain, "Other", customUploadedIcon);
}

function openApp(id){
  window.openAppId = id;
  renderAppPanel();
}

function renderAppPanel(editingId){
  const app = apps.find(a=>a.id===window.openAppId);
  if(!app){ closeModal(); return; }
  const accountsHtml = app.accounts.map((acc,i) => {
    if(editingId === acc.id) return accountForm(app.id, acc);
    const confirming = editingId === 'del:'+acc.id;
    return `
      <div class="acct-card">
        <div class="acct-top">
          <div class="acct-label">${SVG.user} ${esc(acc.label || t('accountFallback',{n:i+1}))}</div>
          <div class="acct-actions">
            <button class="icon-btn" onclick="renderAppPanel('${acc.id}')">${SVG.pencil}</button>
            <button class="icon-btn danger" onclick="renderAppPanel('del:${acc.id}')">${SVG.trash}</button>
          </div>
        </div>
        ${confirming ? `
          <div class="confirm-bar">
            <span>${SVG.warn} ${esc(t('deleteAccountConfirm'))}</span>
            <div style="display:flex; gap:6px; flex-shrink:0;">
              <button class="btn-ghost" onclick="renderAppPanel()">${esc(t('cancel'))}</button>
              <button class="btn-solid danger-solid" onclick="deleteAccount('${app.id}','${acc.id}')">${esc(t('delete'))}</button>
            </div>
          </div>
        ` : `
          ${field(t('usernamePh'), acc.username)}
          ${field(t('email'), acc.email)}
          ${field(t('password'), acc.password, true, acc.id)}
        `}
      </div>
    `;
  }).join('');

  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="panel">
        <div class="panel-head">
          <div class="icon-edit-wrap" onclick="triggerAppIconUpload('${app.id}')" title="Change icon">
            ${iconTile(app)}
            <span class="icon-edit-badge">${SVG.pencil}</span>
          </div>
          <div><h2>${esc(app.name)}</h2><p>${esc(tCount(app.accounts.length,'accountsOne','accountsMany'))}</p></div>
          <button class="close" onclick="closeModal()">${SVG.close}</button>
        </div>
        <div class="panel-body">
          ${accountsHtml}
          ${editingId === 'new' ? accountForm(app.id, null) : `
            <button class="add-acct-btn" onclick="renderAppPanel('new')">${SVG.plus} ${esc(t('addAnotherAccount'))}</button>
          `}
        </div>
        <div class="panel-foot">
          ${editingId === 'del-app' ? `
            <div class="confirm-bar" style="margin:0;">
              <span>${SVG.warn} ${esc(t('deleteAppConfirm',{name:app.name}))}</span>
              <div style="display:flex; gap:6px; flex-shrink:0;">
                <button class="btn-ghost" onclick="renderAppPanel()">${esc(t('cancel'))}</button>
                <button class="btn-solid danger-solid" onclick="deleteApp('${app.id}')">${esc(t('delete'))}</button>
              </div>
            </div>
          ` : `
            <button class="delete-app-btn" onclick="renderAppPanel('del-app')">${SVG.trash} ${esc(t('deleteAppBtn',{name:app.name}))}</button>
          `}
        </div>
      </div>
    </div>
  `;
}

function deleteApp(appId){
  apps = apps.filter(a => a.id !== appId);
  saveApps();
  closeModal();
  render();
}

function field(label, value, secret, acctId){
  if(!value) return '';
  const display = secret ? '••••••••' : esc(value);
  return `
    <div class="field">
      <div class="field-main">
        <div class="lbl">${label}</div>
        <div class="val" ${secret?`id="pw-${acctId}"`:''}>${display}</div>
      </div>
      <div class="acct-actions">
        ${secret ? `<button class="icon-btn" onclick="togglePw('${acctId}','${esc(value)}')" id="eyewrap-${acctId}">${SVG.eye}</button>` : ''}
        <button class="icon-btn" onclick="copyVal('${esc(value)}', this)">${SVG.copy}</button>
      </div>
    </div>
  `;
}

let pwShown = {};
function togglePw(id, real){
  pwShown[id] = !pwShown[id];
  document.getElementById('pw-'+id).textContent = pwShown[id] ? real : '••••••••';
  document.getElementById('eyewrap-'+id).innerHTML = pwShown[id] ? SVG.eyeOff : SVG.eye;
}

function copyVal(val, btn){
  navigator.clipboard && navigator.clipboard.writeText(val).catch(()=>{});
  btn.innerHTML = SVG.check;
  setTimeout(()=>{ btn.innerHTML = SVG.copy; }, 1000);
}

function accountForm(appId, acc){
  return `
    <div class="acct-card form">
      <input id="f-label" placeholder="${esc(t('labelPh'))}" value="${acc?esc(acc.label||''):''}">
      <input id="f-username" placeholder="${esc(t('usernamePh'))}" value="${acc?esc(acc.username||''):''}">
      <input id="f-email" placeholder="${esc(t('email'))}" value="${acc?esc(acc.email||''):''}">
      <input id="f-password" placeholder="${esc(t('password'))}" value="${acc?esc(acc.password||''):''}">
      <div class="form-actions">
        <button class="btn-ghost" onclick="renderAppPanel()">${esc(t('cancel'))}</button>
        <button class="btn-solid" onclick="saveAccount('${appId}','${acc?acc.id:''}')">${esc(t('saveAccount'))}</button>
      </div>
    </div>
  `;
}

function saveAccount(appId, accId){
  const app = apps.find(a=>a.id===appId);
  const data = {
    label: document.getElementById('f-label').value.trim(),
    username: document.getElementById('f-username').value.trim(),
    email: document.getElementById('f-email').value.trim(),
    password: document.getElementById('f-password').value,
  };
  if(accId){
    const acc = app.accounts.find(a=>a.id===accId);
    Object.assign(acc, data);
  } else {
    app.accounts.push({id:uid(), ...data});
  }
  saveApps();
  render();
  renderAppPanel();
}

function deleteAccount(appId, accId){
  const app = apps.find(a=>a.id===appId);
  app.accounts = app.accounts.filter(a=>a.id!==accId);
  saveApps();
  render();
  renderAppPanel();
}

initVault();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/Vault/sw.js").catch(function(){});
}
</script>
