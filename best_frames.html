<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أفضل الصور من الفيديو</title>
<style>
:root{--bg:#f6f7f9;--ink:#14181f;--mute:#6b7380;--line:#e6e9ee;--blue:#2563eb;--gold:#f5b301}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 40px}
.wrap.has-bar{padding-bottom:110px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h1{font-size:22px;margin:0;font-weight:800}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.card{background:#fff;border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 12px;border-radius:16px;background:#f3f6ff;border:1.5px dashed #b9c8ff;cursor:pointer;text-align:center}
.drop .ic{font-size:34px;line-height:1.2}
.drop b{font-size:17px}
.drop small{color:var(--mute);font-size:13px}
.fname{font-size:13px;color:var(--blue);word-break:break-all;margin-top:4px}
.label{font-size:14px;color:var(--mute);margin:16px 0 8px}
.seg{display:flex;background:#eef0f4;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:15px;padding:9px 4px;border-radius:10px;color:var(--mute);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.primary{width:100%;margin-top:16px;border:0;background:var(--blue);color:#fff;font:inherit;font-weight:700;font-size:17px;padding:14px;border-radius:14px;cursor:pointer}
.primary:disabled{background:#b8c6ee;cursor:default}
.prog{height:8px;background:#e6e9ee;border-radius:8px;overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .1s}
.status{color:var(--mute);font-size:14px;margin-top:8px;min-height:20px}
.hidden{display:none!important}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-title b{font-size:17px}
.hero{position:relative;border-radius:16px;overflow:hidden;background:#e9ecf1}
.hero img{width:100%;display:block}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--gold);color:#2b2100;font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px}
.ghost{width:100%;margin-top:12px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;padding:12px;border-radius:12px;cursor:pointer;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.thumb{position:relative;border-radius:14px;overflow:hidden;background:#e9ecf1;cursor:pointer;box-shadow:0 0 0 0 var(--blue);transition:box-shadow .12s}
.thumb img{width:100%;display:block;aspect-ratio:var(--ar,16/10);object-fit:cover}
.thumb.sel{box-shadow:0 0 0 3px var(--blue)}
.chk{position:absolute;top:8px;inset-inline-end:8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.28);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.thumb.sel .chk{background:var(--blue);border-color:var(--blue)}
.meta{position:absolute;bottom:8px;inset-inline:8px;display:flex;justify-content:space-between;gap:6px}
.meta span{background:rgba(20,24,31,.62);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.meta .star{background:var(--gold);color:#2b2100;font-weight:700}
.bar{position:fixed;inset-inline:0;bottom:0;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:860px;margin:0 auto;display:flex;gap:10px}
.bar button{font:inherit;font-weight:700;border-radius:12px;padding:13px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.bar #toggleAll{flex:1}
.bar #dlSel{flex:2;background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <h1 data-i="title"></h1>
    <button class="pill" id="langBtn">Français</button>
  </header>

  <div class="card">
    <label class="drop">
      <input type="file" id="file" accept="video/*" class="hidden">
      <div class="ic">🎞️</div>
      <b data-i="pick"></b>
      <small data-i="pickSub"></small>
      <div class="fname" id="fname"></div>
    </label>

    <div class="label" data-i="every"></div>
    <div class="seg" id="stepSeg">
      <button data-v="0.25">0.25</button>
      <button data-v="0.5" class="on">0.5</button>
      <button data-v="1">1</button>
      <button data-v="2">2</button>
    </div>

    <button class="primary" id="go" disabled data-i="go"></button>
    <div class="prog hidden" id="barBox"><i id="bar"></i></div>
    <div class="status" id="status"></div>
  </div>

  <div id="results" class="hidden">
    <div class="card">
      <div class="hero">
        <img id="bestImg" alt="">
        <div class="tag" id="bestTag"></div>
      </div>
      <button class="ghost" id="dlBest" data-i="dlBest"></button>
    </div>

    <div class="card">
      <div class="sec-title">
        <b><span data-i="all"></span> · <span id="count">0</span></b>
      </div>
      <div class="seg" id="sortSeg">
        <button data-v="q" class="on" data-i="sortQ"></button>
        <button data-v="t" data-i="sortT"></button>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
</div>

<div class="bar hidden" id="actionBar">
  <div class="in">
    <button id="toggleAll"></button>
    <button id="dlSel"></button>
  </div>
</div>

<video id="video" muted playsinline webkit-playsinline preload="auto" style="position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0"></video>

<script>
const T = {
  ar: {
    title: "أفضل الصور من الفيديو",
    pick: "اختر فيديو",
    pickSub: "من معرض الصور أو الملفات",
    every: "صورة كل … (بالثواني)",
    go: "استخراج الصور",
    best: "الأفضل",
    dlBest: "تحميل أفضل صورة",
    all: "كل الصور",
    sortQ: "حسب الجودة",
    sortT: "حسب الوقت",
    selAll: "تحديد الكل",
    selNone: "إلغاء التحديد",
    dlSel: "تحميل المحدد",
    loading: "جاري التحميل…",
    working: (a, b) => `جاري التحليل… ${a} / ${b}`,
    done: n => `تم! استُخرجت ${n} صورة.`,
    err: "تعذّر قراءة هذا الفيديو.",
    zipping: "جاري تجهيز الملف…",
    none: "اختر صورة واحدة على الأقل."
  },
  fr: {
    title: "Meilleures images de la vidéo",
    pick: "Choisir une vidéo",
    pickSub: "Depuis la photothèque ou les fichiers",
    every: "Une image toutes les … (secondes)",
    go: "Extraire les images",
    best: "Meilleure",
    dlBest: "Télécharger la meilleure image",
    all: "Toutes les images",
    sortQ: "Par qualité",
    sortT: "Par temps",
    selAll: "Tout sélectionner",
    selNone: "Désélectionner",
    dlSel: "Télécharger la sélection",
    loading: "Chargement…",
    working: (a, b) => `Analyse… ${a} / ${b}`,
    done: n => `Terminé ! ${n} images extraites.`,
    err: "Impossible de lire cette vidéo.",
    zipping: "Préparation du fichier…",
    none: "Choisissez au moins une image."
  }
};
let lang = "ar", sortMode = "q", file = null, frames = [], busy = false, ar = "16 / 9";
const $ = id => document.getElementById(id);
const t = k => T[lang][k];

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.dataset.i); });
  $("langBtn").textContent = lang === "ar" ? "Français" : "العربية";
  updateBar();
  if (frames.length) $("bestTag").textContent = "⭐ " + t("best") + " · " + pct(frames[0]) + "%";
}
$("langBtn").onclick = () => { lang = lang === "ar" ? "fr" : "ar"; applyLang(); };

function bindSeg(id, cb) {
  $(id).querySelectorAll("button").forEach(b => b.onclick = () => {
    $(id).querySelectorAll("button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    cb(b.dataset.v);
  });
}
let step = 0.5;
bindSeg("stepSeg", v => step = parseFloat(v));
bindSeg("sortSeg", v => { sortMode = v; renderGrid(); });

const MAX_FRAMES = 200;
const video = $("video");

$("file").onchange = e => {
  file = e.target.files[0] || null;
  $("fname").textContent = file ? "✓ " + file.name : "";
  $("go").disabled = !file;
};

function seek(time) {
  return new Promise(res => {
    const done = () => { video.removeEventListener("seeked", done); clearTimeout(tm); res(); };
    const tm = setTimeout(done, 4000);
    video.addEventListener("seeked", done);
    video.currentTime = time;
  });
}
function toBlob(canvas) {
  return new Promise(res => canvas.toBlob(res, "image/jpeg", 0.92));
}

// ---------- تحليل جودة الصورة ----------
const sc = document.createElement("canvas");
const sctx = sc.getContext("2d", { willReadFrequently: true });
const GRID = 6;
function analyze(source, vw, vh) {
  const w = 640, h = Math.max(8, Math.round(640 * vh / vw));
  sc.width = w; sc.height = h;
  sctx.drawImage(source, 0, 0, w, h);
  const d = sctx.getImageData(0, 0, w, h).data;
  const g = new Float32Array(w * h);
  let sum = 0, sum2 = 0, clip = 0;
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    const v = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    g[p] = v; sum += v; sum2 += v * v;
    if (v < 10 || v > 245) clip++;
  }
  const n = w * h, mean = sum / n;
  const std = Math.sqrt(Math.max(0, sum2 / n - mean * mean));

  // الحدة: تباين لابلاس لكل مربع صغير، ثم متوسط أوضح 30% من المربعات
  // (هكذا لا تُظلم الصورة التي فيها جدار فارغ وموضوع واضح)
  const tl = new Float64Array(GRID * GRID), tl2 = new Float64Array(GRID * GRID), tc = new Float64Array(GRID * GRID);
  for (let y = 1; y < h - 1; y++) {
    const ty = Math.min(GRID - 1, Math.floor(y * GRID / h));
    for (let x = 1; x < w - 1; x++) {
      const p = y * w + x;
      const l = 4 * g[p] - g[p - 1] - g[p + 1] - g[p - w] - g[p + w];
      const k = ty * GRID + Math.min(GRID - 1, Math.floor(x * GRID / w));
      tl[k] += l; tl2[k] += l * l; tc[k]++;
    }
  }
  const vars = [];
  for (let k = 0; k < GRID * GRID; k++) if (tc[k]) { const m = tl[k] / tc[k]; vars.push(tl2[k] / tc[k] - m * m); }
  vars.sort((a, b) => b - a);
  const top = vars.slice(0, Math.max(1, Math.round(vars.length * 0.3)));
  const sharp = top.reduce((a, b) => a + b, 0) / top.length;

  let expo = 1 - Math.abs(mean - 125) / 125;
  expo = Math.max(0, Math.min(1, expo)) * (1 - Math.min(1, (clip / n) * 2));
  const contrast = Math.min(1, std / 60);
  return { sharp, expo, contrast };
}
const pct = f => Math.round(f.score * 100);

async function run() {
  if (!file || busy) return;
  busy = true;
  $("go").disabled = true;
  frames.forEach(f => URL.revokeObjectURL(f.url));
  frames = [];
  $("results").classList.add("hidden");
  $("actionBar").classList.add("hidden");
  $("wrap").classList.remove("has-bar");
  $("barBox").classList.remove("hidden");
  $("bar").style.width = "0%";
  $("status").textContent = t("loading");

  try {
    // محاولات متعددة: الآيفون أحيانًا يحتاج نوع الملف صراحةً
    const variants = [file, new Blob([file], { type: "video/mp4" }), new Blob([file], { type: "video/quicktime" })];
    let lastErr = null, ok = false;
    for (const v of variants) {
      const src = URL.createObjectURL(v);
      video.src = src;
      video.load();
      try {
        await new Promise((res, rej) => {
          const to = setTimeout(() => rej(new Error("timeout")), 15000);
          video.onloadedmetadata = () => { clearTimeout(to); res(); };
          video.onerror = () => { clearTimeout(to); rej(new Error("media error " + (video.error ? video.error.code : "?"))); };
        });
        ok = true;
        break;
      } catch (e) { lastErr = e; URL.revokeObjectURL(src); }
    }
    if (!ok) throw lastErr;
    // iOS: لا يحمّل الفيديو إطاراته قبل محاولة التشغيل
    try { await video.play(); video.pause(); } catch (e) {}
    if (video.readyState < 2) {
      await new Promise(res => { video.onloadeddata = res; setTimeout(res, 5000); });
    }
    const dur = video.duration;
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!isFinite(dur) || !vw) throw new Error("bad");

    let times = [];
    for (let x = Math.min(step / 2, dur / 2); x < dur; x += step) times.push(x);
    if (times.length > MAX_FRAMES) {
      const k = times.length / MAX_FRAMES;
      times = Array.from({ length: MAX_FRAMES }, (_, i) => times[Math.floor(i * k)]);
    }

    const scale = Math.min(1, 1920 / Math.max(vw, vh));
    const cw = Math.round(vw * scale), ch = Math.round(vh * scale);
    ar = cw + " / " + ch;
    const canvas = document.createElement("canvas");
    canvas.width = cw; canvas.height = ch;
    const ctx = canvas.getContext("2d");

    for (let i = 0; i < times.length; i++) {
      await seek(times[i]);
      ctx.drawImage(video, 0, 0, cw, ch);
      const m = analyze(canvas, cw, ch);
      const blob = await toBlob(canvas);
      frames.push({ time: times[i], blob, url: URL.createObjectURL(blob), m, selected: false });
      $("bar").style.width = Math.round(((i + 1) / times.length) * 100) + "%";
      $("status").textContent = t("working")(i + 1, times.length);
    }

    // الدرجة النهائية
    const maxSharp = Math.max(...frames.map(f => f.m.sharp)) || 1;
    frames.forEach(f => {
      const s = Math.sqrt(f.m.sharp / maxSharp);
      f.score = 0.65 * s + 0.2 * f.m.expo + 0.15 * f.m.contrast;
    });
    frames.sort((a, b) => b.score - a.score);
    frames.forEach((f, i) => { f.rank = i + 1; });
    frames[0].selected = true;

    $("results").classList.remove("hidden");
    $("actionBar").classList.remove("hidden");
    $("wrap").classList.add("has-bar");
    $("bestImg").src = frames[0].url;
    $("count").textContent = frames.length;
    renderGrid();
    applyLang();
    $("status").textContent = t("done")(frames.length);
    $("results").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    $("status").textContent = t("err") + " (" + (e && e.message ? e.message : e) + ")";
  }
  $("barBox").classList.add("hidden");
  busy = false;
  $("go").disabled = false;
}
$("go").onclick = run;

function fmtTime(s) {
  if (s < 60) return s.toFixed(1) + "s";
  const m = Math.floor(s / 60), r = (s % 60).toFixed(0);
  return m + ":" + r.padStart(2, "0");
}
function renderGrid() {
  const list = sortMode === "q" ? frames : [...frames].sort((a, b) => a.time - b.time);
  const grid = $("grid");
  grid.innerHTML = "";
  grid.style.setProperty("--ar", ar);
  list.forEach(f => {
    const d = document.createElement("div");
    d.className = "thumb" + (f.selected ? " sel" : "");
    d.innerHTML = `<img src="${f.url}" alt="">
      <div class="chk">${f.selected ? "✓" : ""}</div>
      <div class="meta"><span class="${f.rank === 1 ? "star" : ""}">${f.rank === 1 ? "⭐ " : ""}${pct(f)}%</span><span>${fmtTime(f.time)}</span></div>`;
    d.onclick = () => {
      f.selected = !f.selected;
      d.classList.toggle("sel", f.selected);
      d.querySelector(".chk").textContent = f.selected ? "✓" : "";
      updateBar();
    };
    grid.appendChild(d);
  });
  updateBar();
}
function updateBar() {
  const n = frames.filter(f => f.selected).length;
  const all = frames.length && n === frames.length;
  $("toggleAll").textContent = all ? t("selNone") : t("selAll");
  $("dlSel").textContent = t("dlSel") + (n ? " (" + n + ")" : "");
}
$("toggleAll").onclick = () => {
  const all = frames.every(f => f.selected);
  frames.forEach(f => f.selected = !all);
  renderGrid();
};

function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function nameOf(f) {
  return `image_${String(f.rank).padStart(3, "0")}_${f.time.toFixed(1)}s.jpg`;
}
$("dlBest").onclick = () => download(frames[0].blob, nameOf(frames[0]));

//ZIP-START
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// ملف ZIP بدون ضغط (الصور مضغوطة أصلاً)
function makeZip(files) {
  const enc = new TextEncoder();
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true);
    ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true);
    ch.setUint32(24, size, true); ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true);
    ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  }
  let cdSize = 0;
  central.forEach(p => cdSize += p.length);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true); end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
}
//ZIP-END

$("dlSel").onclick = async () => {
  const sel = frames.filter(f => f.selected);
  if (!sel.length) { $("status").textContent = t("none"); return; }
  if (sel.length === 1) { download(sel[0].blob, nameOf(sel[0])); return; }
  $("status").textContent = t("zipping");
  const files = [];
  for (const f of sel) files.push({ name: nameOf(f), data: new Uint8Array(await f.blob.arrayBuffer()) });
  download(makeZip(files), "images.zip");
  $("status").textContent = "";
};

applyLang();
</script>
</body>
</html>
